name: Dashboard checks
on:
  push:
    paths: ["*.py", "requirements.txt", "results_snapshot.json", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["*.py", "requirements.txt", "results_snapshot.json", ".github/workflows/dashboard.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_dashboard -v
